<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orangie Shuffle Domain Notice</title>
  <meta name="description" content="Orangie and Shuffle are no longer working together on this domain.">
  <meta property="og:title" content="Orangie Shuffle Domain Notice">
  <meta property="og:description" content="Orangie and Shuffle are no longer working together on this domain.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://orangieshuffle.com">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Orangie Shuffle Domain Notice">
  <meta name="twitter:description" content="Orangie and Shuffle are no longer working together on this domain.">
  <style>
    :root {
      color-scheme: dark;
      --bg: #08090c;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --line: rgba(255, 255, 255, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(100%, 680px);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 48px 0;
      text-align: center;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: clamp(18px, 3vw, 22px);
    }

    strong {
      display: block;
      margin-bottom: 14px;
      color: var(--text);
      font-size: clamp(28px, 6vw, 52px);
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: 0;
    }
  </style>
</head>
<body>
  <main>
    <p>
      <strong>Domain Notice</strong>
      Orangie and Shuffle are no longer working together on this domain.
    </p>
  </main>
</body>
</html>
